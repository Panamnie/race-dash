<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Race Dash Landscape</title>

  <style>
    :root {
      --bg: #030405;
      --panel: #0b0d10;
      --panel2: #11141a;
      --line: #242a33;
      --text: #f4f6fb;
      --muted: #8b94a3;
      --cyan: #20eaff;
      --green: #47ff67;
      --yellow: #f5ff00;
      --amber: #ffb21a;
      --red: #ff3152;
      --blue: #168cff;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      min-height: 100%;
      background: #000;
      color: var(--text);
      font-family: Arial, Helvetica, sans-serif;
      overflow: hidden;
      touch-action: manipulation;
    }

    body {
      background:
        radial-gradient(circle at top, #171b22 0%, #050607 48%, #000 100%);
    }

    .dash {
      width: 100vw;
      height: 100vh;
      padding: 10px;
      display: grid;
      grid-template-rows: 58px 1fr 96px;
      gap: 8px;
      background:
        linear-gradient(180deg, rgba(255,255,255,0.025), rgba(255,255,255,0)),
        repeating-linear-gradient(
          135deg,
          rgba(255,255,255,0.018) 0,
          rgba(255,255,255,0.018) 2px,
          transparent 2px,
          transparent 9px
        );
    }

    .top-row {
      display: grid;
      grid-template-columns: 1.1fr 0.8fr 0.8fr 0.8fr;
      gap: 8px;
    }

    .main-row {
      display: grid;
      grid-template-columns: 1.15fr 1fr;
      gap: 8px;
      min-height: 0;
    }

    .bottom-row {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
    }

    .card {
      position: relative;
      background: linear-gradient(180deg, #12161c, #07090c);
      border: 1px solid var(--line);
      border-radius: 12px;
      overflow: hidden;
      box-shadow:
        inset 0 1px 0 rgba(255,255,255,0.04),
        0 8px 20px rgba(0,0,0,0.35);
    }

    .card::after {
      content: "";
      position: absolute;
      inset: 0;
      background:
        linear-gradient(90deg, rgba(255,255,255,0.025), transparent 20%, transparent 80%, rgba(255,255,255,0.015)),
        repeating-linear-gradient(
          90deg,
          rgba(255,255,255,0.012) 0,
          rgba(255,255,255,0.012) 1px,
          transparent 1px,
          transparent 8px
        );
      pointer-events: none;
    }

    .label {
      color: var(--muted);
      font-size: clamp(10px, 1.6vw, 17px);
      font-weight: 900;
      letter-spacing: 1.7px;
      text-transform: uppercase;
    }

    .small {
      font-size: clamp(9px, 1.3vw, 14px);
      color: var(--muted);
      font-weight: 800;
      letter-spacing: 1px;
    }

    .select-card {
      padding: 8px 10px;
      display: grid;
      grid-template-rows: auto 1fr;
      gap: 5px;
    }

    select {
      width: 100%;
      height: 100%;
      min-height: 32px;
      background: #050608;
      border: 1px solid #293241;
      border-radius: 9px;
      color: var(--text);
      font-size: clamp(18px, 3vw, 36px);
      font-weight: 900;
      padding: 4px 12px;
      outline: none;
    }

    .top-stat {
      padding: 7px 10px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 4px;
    }

    .top-value {
      font-size: clamp(25px, 4.5vw, 54px);
      font-weight: 300;
      line-height: 1;
      color: var(--text);
      white-space: nowrap;
    }

    .top-value.delta-plus {
      color: var(--red);
      text-shadow: 0 0 13px rgba(255,49,82,0.25);
    }

    .top-value.delta-minus {
      color: var(--green);
      text-shadow: 0 0 13px rgba(71,255,103,0.22);
    }

    .top-value.pos {
      color: var(--yellow);
      font-weight: 900;
      text-shadow: 0 0 14px rgba(245,255,0,0.18);
    }

    .top-value.time {
      color: var(--text);
      font-size: clamp(18px, 3vw, 42px);
    }

    .last-card {
      padding: 12px;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .last-title {
      color: var(--cyan);
      margin-bottom: 6px;
    }

    .last-value {
      color: var(--text);
      font-size: clamp(54px, 12vw, 150px);
      font-weight: 300;
      line-height: 0.95;
      letter-spacing: -3px;
      text-shadow: 0 0 18px rgba(32,234,255,0.08);
    }

    .right-stack {
      display: grid;
      grid-template-rows: 1fr 0.78fr;
      gap: 8px;
      min-height: 0;
    }

    .best-card {
      padding: 12px;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .best-title {
      color: var(--green);
      margin-bottom: 6px;
    }

    .best-value {
      color: var(--green);
      font-size: clamp(45px, 9vw, 116px);
      font-weight: 300;
      line-height: 0.95;
      letter-spacing: -2px;
      text-shadow: 0 0 16px rgba(71,255,103,0.18);
    }

    .race-card {
      display: grid;
      grid-template-columns: 0.75fr 1.35fr;
      gap: 8px;
      padding: 10px;
    }

    .race-pos-box {
      background: rgba(245,255,0,0.09);
      border: 1px solid rgba(245,255,0,0.16);
      border-radius: 10px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    }

    .race-pos-label {
      color: var(--muted);
      font-size: clamp(10px, 1.4vw, 16px);
      font-weight: 900;
      letter-spacing: 1px;
      margin-bottom: 3px;
    }

    .race-pos {
      color: var(--yellow);
      font-size: clamp(52px, 10vw, 130px);
      font-weight: 900;
      line-height: 0.9;
      text-shadow: 0 0 18px rgba(245,255,0,0.18);
    }

    .driver-box {
      display: grid;
      grid-template-rows: 1fr auto auto;
      gap: 4px;
      align-content: center;
      min-width: 0;
    }

    .driver-name {
      font-size: clamp(21px, 4vw, 56px);
      font-weight: 900;
      line-height: 1;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .driver-info {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 6px;
    }

    .info-mini {
      background: rgba(255,255,255,0.035);
      border: 1px solid rgba(255,255,255,0.07);
      border-radius: 8px;
      padding: 5px 7px;
    }

    .info-mini .val {
      font-size: clamp(15px, 2.2vw, 27px);
      font-weight: 900;
      line-height: 1;
      color: var(--text);
    }

    .data-age {
      color: var(--muted);
      font-size: clamp(9px, 1.2vw, 13px);
      letter-spacing: 1px;
      text-transform: uppercase;
    }

    .sector-card {
      padding: 8px 10px;
      display: grid;
      grid-template-rows: auto 1fr;
      align-items: center;
    }

    .sector-value {
      font-size: clamp(34px, 6.5vw, 80px);
      font-weight: 300;
      line-height: 1;
      text-align: center;
    }

    .s1 {
      color: var(--cyan);
      text-shadow: 0 0 14px rgba(32,234,255,0.13);
    }

    .s2 {
      color: var(--amber);
      text-shadow: 0 0 14px rgba(255,178,26,0.15);
    }

    .s3 {
      color: var(--green);
      text-shadow: 0 0 14px rgba(71,255,103,0.13);
    }

    .warn {
      position: fixed;
      left: 12px;
      bottom: 8px;
      color: var(--red);
      font-size: 12px;
      font-weight: 800;
      z-index: 20;
      pointer-events: none;
      max-width: 50vw;
    }

    .fullscreen-btn {
      position: fixed;
      right: 12px;
      bottom: 8px;
      z-index: 50;
      background: linear-gradient(180deg, #18202a, #07090c);
      border: 1px solid rgba(32,234,255,0.45);
      color: var(--cyan);
      border-radius: 10px;
      padding: 9px 14px;
      font-size: 13px;
      font-weight: 900;
      letter-spacing: 1px;
      text-transform: uppercase;
      box-shadow: 0 0 14px rgba(32,234,255,0.12);
    }

    .fullscreen-btn:active {
      transform: scale(0.96);
    }

    body.fullscreen-mode .dash {
      padding: 6px;
      gap: 6px;
    }

    body.fullscreen-mode .fullscreen-btn {
      opacity: 0.45;
    }

    body.fullscreen-mode .fullscreen-btn:hover,
    body.fullscreen-mode .fullscreen-btn:active {
      opacity: 1;
    }

    @media (orientation: portrait) {
      html, body {
        overflow: auto;
      }

      .dash {
        height: auto;
        min-height: 100vh;
        grid-template-rows: auto auto auto;
      }

      .top-row {
        grid-template-columns: 1fr 1fr;
      }

      .select-card {
        grid-column: 1 / -1;
      }

      .main-row {
        grid-template-columns: 1fr;
      }

      .bottom-row {
        grid-template-columns: 1fr;
      }

      .last-value {
        font-size: 82px;
      }

      .best-value {
        font-size: 64px;
      }

      .fullscreen-btn {
        right: 10px;
        bottom: 10px;
      }
    }
  </style>
</head>

<body>
  <div class="dash">
    <div class="top-row">
      <div class="card select-card">
        <div class="label">Wybierz wózek</div>
        <select id="kartSelect">
          <option value="">Ładowanie...</option>
        </select>
      </div>

      <div class="card top-stat">
        <div class="label">Delta do poprzedniego</div>
        <div class="top-value" id="prevDelta">---</div>
      </div>

      <div class="card top-stat">
        <div class="label">Pozycja</div>
        <div class="top-value pos" id="positionTop">P--</div>
      </div>

      <div class="card top-stat">
        <div class="label">Czas sesji</div>
        <div class="top-value time" id="sessionTime">--:--:--</div>
      </div>
    </div>

    <div class="main-row">
      <div class="card last-card">
        <div class="label last-title">Last lap</div>
        <div class="last-value" id="lastLap">--.--</div>
      </div>

      <div class="right-stack">
        <div class="card best-card">
          <div class="label best-title">Best lap</div>
          <div class="best-value" id="bestLap">--.--</div>
        </div>

        <div class="card race-card">
          <div class="race-pos-box">
            <div class="race-pos-label">Pozycja w wyścigu</div>
            <div class="race-pos" id="racePosition">--</div>
          </div>

          <div class="driver-box">
            <div class="driver-name" id="driver">BRAK DANYCH</div>

            <div class="driver-info">
              <div class="info-mini">
                <div class="small">KART</div>
                <div class="val" id="kartNumber">--</div>
              </div>

              <div class="info-mini">
                <div class="small">LAP</div>
                <div class="val" id="sessionLap">--</div>
              </div>

              <div class="info-mini">
                <div class="small">OKR.</div>
                <div class="val" id="laps">--</div>
              </div>
            </div>

            <div class="data-age" id="dataAge">---</div>
          </div>
        </div>
      </div>
    </div>

    <div class="bottom-row">
      <div class="card sector-card">
        <div class="label">Sector 1</div>
        <div class="sector-value s1" id="s1">---</div>
      </div>

      <div class="card sector-card">
        <div class="label">Sector 2</div>
        <div class="sector-value s2" id="s2">---</div>
      </div>

      <div class="card sector-card">
        <div class="label">Sector 3</div>
        <div class="sector-value s3" id="s3">---</div>
      </div>
    </div>
  </div>

  <div class="warn" id="warn"></div>

  <button class="fullscreen-btn" id="fullscreenBtn" type="button">
    FULLSCREEN
  </button>

  <script>
    const select = document.getElementById("kartSelect");

    const el = {
      prevDelta: document.getElementById("prevDelta"),
      positionTop: document.getElementById("positionTop"),
      sessionTime: document.getElementById("sessionTime"),
      lastLap: document.getElementById("lastLap"),
      bestLap: document.getElementById("bestLap"),
      racePosition: document.getElementById("racePosition"),
      driver: document.getElementById("driver"),
      kartNumber: document.getElementById("kartNumber"),
      sessionLap: document.getElementById("sessionLap"),
      laps: document.getElementById("laps"),
      s1: document.getElementById("s1"),
      s2: document.getElementById("s2"),
      s3: document.getElementById("s3"),
      dataAge: document.getElementById("dataAge"),
      warn: document.getElementById("warn"),
      fullscreenBtn: document.getElementById("fullscreenBtn")
    };

    let availableKarts = [];
    let selectedKartMemory = localStorage.getItem("selectedKart") || "";
    let firstKartLoaded = false;
    let lastDataUpdate = null;

    const lapMemory = {};
    const deltaMemory = {};

    function value(v, fallback = "---") {
      if (v === undefined || v === null || v === "") return fallback;
      return String(v);
    }

    function parseLapTime(t) {
      if (!t) return null;

      const text = String(t).trim().replace(",", ".");
      const parts = text.split(":");

      if (parts.length === 1) {
        const n = Number(parts[0]);
        return Number.isFinite(n) ? n : null;
      }

      if (parts.length === 2) {
        const min = Number(parts[0]);
        const sec = Number(parts[1]);
        if (Number.isFinite(min) && Number.isFinite(sec)) {
          return min * 60 + sec;
        }
      }

      return null;
    }

    function formatDelta(seconds) {
      if (seconds === null || seconds === undefined || !Number.isFinite(seconds)) {
        return "---";
      }

      const sign = seconds >= 0 ? "+" : "-";
      return sign + Math.abs(seconds).toFixed(3);
    }

    function updatePrevDelta(kart, lastLap) {
      const lapSec = parseLapTime(lastLap);
      if (lapSec === null) return deltaMemory[kart] || "---";

      if (lapMemory[kart] === undefined) {
        lapMemory[kart] = lapSec;
        deltaMemory[kart] = "---";
        return "---";
      }

      if (Math.abs(lapMemory[kart] - lapSec) > 0.001) {
        const diff = lapSec - lapMemory[kart];
        lapMemory[kart] = lapSec;
        deltaMemory[kart] = formatDelta(diff);
      }

      return deltaMemory[kart] || "---";
    }

    function setDeltaColor(deltaText) {
      el.prevDelta.classList.remove("delta-plus", "delta-minus");

      if (deltaText.startsWith("+")) {
        el.prevDelta.classList.add("delta-plus");
      } else if (deltaText.startsWith("-")) {
        el.prevDelta.classList.add("delta-minus");
      }
    }

    function sortKarts(karts) {
      return karts.sort((a, b) => {
        const na = Number(a);
        const nb = Number(b);

        if (!Number.isNaN(na) && !Number.isNaN(nb)) return na - nb;
        return String(a).localeCompare(String(b));
      });
    }

    function uniqueList(list) {
      return [...new Set(list)];
    }

    function showEmpty(kartNumber, message) {
      el.prevDelta.textContent = "---";
      setDeltaColor("---");
      el.positionTop.textContent = "P--";
      el.sessionTime.textContent = "--:--:--";
      el.lastLap.textContent = "--.--";
      el.bestLap.textContent = "--.--";
      el.racePosition.textContent = "--";
      el.driver.textContent = "BRAK DANYCH";
      el.kartNumber.textContent = kartNumber || "--";
      el.sessionLap.textContent = "--";
      el.laps.textContent = "--";
      el.s1.textContent = "---";
      el.s2.textContent = "---";
      el.s3.textContent = "---";
      el.dataAge.textContent = "---";
      el.warn.textContent = message || "";
    }

    function updateDataAge() {
      if (!lastDataUpdate) {
        el.dataAge.textContent = "---";
        return;
      }

      const diffSec = ((Date.now() - lastDataUpdate) / 1000).toFixed(1);
      el.dataAge.textContent = "AKTUALIZACJA: " + diffSec + " s temu";
    }

    async function loadAvailableKarts() {
      try {
        const res = await fetch("/api/live", { cache: "no-store" });
        const data = await res.json();

        if (!data.karts || !Array.isArray(data.karts)) return;

        const newKarts = sortKarts(uniqueList(
          data.karts
            .map(k => String(k.kart))
            .filter(k => k && k !== "undefined" && k !== "null")
        ));

        const oldList = availableKarts.join(",");
        const newList = newKarts.join(",");

        if (oldList === newList && firstKartLoaded) return;

        availableKarts = newKarts;
        const currentSelected = select.value || selectedKartMemory;

        select.innerHTML = "";

        if (availableKarts.length === 0) {
          const option = document.createElement("option");
          option.value = "";
          option.textContent = "Brak wózków";
          select.appendChild(option);

          firstKartLoaded = false;
          showEmpty("", "Brak dostępnych wózków");
          return;
        }

        availableKarts.forEach(kartNumber => {
          const option = document.createElement("option");
          option.value = kartNumber;
          option.textContent = "Wózek " + kartNumber;
          select.appendChild(option);
        });

        if (availableKarts.includes(currentSelected)) {
          select.value = currentSelected;
        } else {
          select.value = availableKarts[0];
        }

        selectedKartMemory = select.value;
        localStorage.setItem("selectedKart", selectedKartMemory);

        firstKartLoaded = true;
        loadKart();

      } catch (err) {
        el.warn.textContent = "Błąd listy wózków";
      }
    }

    async function loadKart() {
      const kartNumber = select.value;

      if (!kartNumber) {
        showEmpty("", "Wybierz wózek");
        return;
      }

      try {
        const res = await fetch(`/api/kart/${kartNumber}`, { cache: "no-store" });
        const data = await res.json();

        if (!res.ok || data.error) {
          showEmpty(kartNumber, data.message || "Brak danych dla wózka");
          return;
        }

        const position = value(data.position, "--");
        const lastLap = value(data.lastLap, "--.--");
        const bestLap = value(data.bestLap, "--.--");

        const prevDelta = updatePrevDelta(kartNumber, lastLap);

        el.prevDelta.textContent = prevDelta;
        setDeltaColor(prevDelta);

        el.positionTop.textContent = "P" + position;
        el.sessionTime.textContent = value(data.sessionTime, "--:--:--");

        el.lastLap.textContent = lastLap;
        el.bestLap.textContent = bestLap;

        el.racePosition.textContent = position;
        el.driver.textContent = value(data.driver, "BRAK DANYCH");

        el.kartNumber.textContent = value(data.kart, kartNumber);
        el.sessionLap.textContent = value(data.sessionLap, "--");
        el.laps.textContent = value(data.laps, "--");

        el.s1.textContent = value(data.sector1, "---");
        el.s2.textContent = value(data.sector2, "---");
        el.s3.textContent = value(data.sector3, "---");

        el.warn.textContent = "";

        if (data.updatedAt) {
          const parsedDate = new Date(data.updatedAt).getTime();
          if (!Number.isNaN(parsedDate)) {
            lastDataUpdate = parsedDate;
            updateDataAge();
          }
        }

      } catch (err) {
        showEmpty(kartNumber, "Brak połączenia z lokalnym serwerem");
      }
    }

    function isFullscreen() {
      return document.fullscreenElement ||
             document.webkitFullscreenElement ||
             document.msFullscreenElement;
    }

    function updateFullscreenButton() {
      if (isFullscreen()) {
        el.fullscreenBtn.textContent = "EXIT";
        document.body.classList.add("fullscreen-mode");
      } else {
        el.fullscreenBtn.textContent = "FULLSCREEN";
        document.body.classList.remove("fullscreen-mode");
      }
    }

    async function enterFullscreen() {
      const target = document.documentElement;

      try {
        if (target.requestFullscreen) {
          await target.requestFullscreen();
        } else if (target.webkitRequestFullscreen) {
          target.webkitRequestFullscreen();
        } else if (target.msRequestFullscreen) {
          target.msRequestFullscreen();
        }

        if (screen.orientation && screen.orientation.lock) {
          try {
            await screen.orientation.lock("landscape");
          } catch (err) {
            console.log("Nie można zablokować orientacji:", err);
          }
        }
      } catch (err) {
        console.log("Fullscreen error:", err);
        el.warn.textContent = "Przeglądarka nie pozwoliła wejść w fullscreen";
      }

      updateFullscreenButton();
    }

    async function exitFullscreen() {
      try {
        if (document.exitFullscreen) {
          await document.exitFullscreen();
        } else if (document.webkitExitFullscreen) {
          document.webkitExitFullscreen();
        } else if (document.msExitFullscreen) {
          document.msExitFullscreen();
        }

        if (screen.orientation && screen.orientation.unlock) {
          try {
            screen.orientation.unlock();
          } catch (err) {
            console.log("Nie można odblokować orientacji:", err);
          }
        }
      } catch (err) {
        console.log("Exit fullscreen error:", err);
      }

      updateFullscreenButton();
    }

    el.fullscreenBtn.addEventListener("click", function () {
      if (isFullscreen()) {
        exitFullscreen();
      } else {
        enterFullscreen();
      }
    });

    document.addEventListener("fullscreenchange", updateFullscreenButton);
    document.addEventListener("webkitfullscreenchange", updateFullscreenButton);
    document.addEventListener("MSFullscreenChange", updateFullscreenButton);

    select.addEventListener("change", function () {
      selectedKartMemory = select.value;
      localStorage.setItem("selectedKart", selectedKartMemory);
      loadKart();
    });

    loadAvailableKarts();

    setInterval(loadAvailableKarts, 2000);
    setInterval(loadKart, 200);
    setInterval(updateDataAge, 200);

    updateFullscreenButton();
  </script>
</body>
</html>
